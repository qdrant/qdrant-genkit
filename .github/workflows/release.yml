name: Publish NPM Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm-release:
    name: NPM Publish
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7
      - name: Setup | Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: NPM Publish
        run: |
          npm i && npm run build && npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ./js
